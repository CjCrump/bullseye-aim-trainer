<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bullseye target">
  <!-- Outer scoring zone (1 point) -->
  <circle cx="50" cy="50" r="49" fill="#e23b2e" />
  <!-- Subtle inner shading on the outer ring for depth -->
  <circle cx="50" cy="50" r="49" fill="url(#sheen)" />
  <!-- Boundary hairline so the center (2x) zone is visible at a glance -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.4" />
  <!-- Center scoring zone (2 points) — radius 20 = 0.4 of outer, matches hit detection -->
  <circle cx="50" cy="50" r="20" fill="#17100e" />
  <!-- Center aim pip (brand signal-orange) -->
  <circle cx="50" cy="50" r="3.2" fill="#ff6a2c" />
  <defs>
    <radialGradient id="sheen" cx="34%" cy="30%" r="75%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)" />
      <stop offset="42%" stop-color="rgba(255,255,255,0.04)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)" />
    </radialGradient>
  </defs>
</svg>
